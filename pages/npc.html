<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MageCV — Visitor</title>
  <link rel="stylesheet" href="../styles/main.css">
  <link rel="stylesheet" href="../styles/npc.css">
</head>

<body>

  <main class="npc-screen screen-wrapper">

    <!-- Timer bar (hidden for chat) -->
    <div class="npc-timer-bar" id="npcTimerBar">
      <div class="npc-timer-fill" id="timerFill"></div>
    </div>

    <!-- NPC identity (always visible) -->
    <div class="npc-header">
      <div class="npc-portrait" id="npcPortrait">?</div>
      <div>
        <h2 class="screen-title" id="npcName">A visitor arrives...</h2>
        <p class="screen-subtitle" id="npcDescription"></p>
      </div>
    </div>

    <!-- STATE 1: Initial Question Window -->
    <div class="npc-state-initial" id="npcStateInitial">
      <div class="panel npc-dialogue">
        <p id="npcMessage">...</p>
      </div>
    </div>

    <!-- STATE 2: Chat History Window -->
    <div class="npc-state-chat" id="npcStateChat" style="display: none;">
      <div class="npc-history-panel" id="npcHistory">
        <!-- Populated by npc.js -->
      </div>
    </div>

    <!-- Choices (shared between states) -->
    <div class="npc-choices" id="npcChoices">
      <!-- Populated by npc.js -->
    </div>

    <!-- Skip -->
    <button class="btn-secondary npc-skip" id="npcSkipBtn" onclick="skipNPC()">
      Ignore and return
    </button>

  </main>

  <script src="../js/data/jobCards.js"></script>
  <script src="../js/data/npcs.js"></script>
  <script src="../js/data/messages.js"></script>
  <script src="../js/core/storage.js"></script>
  <script src="../js/core/game.js"></script>
  <script src="../js/core/modifiers.js"></script>
  <script src="../js/screens/npc.js"></script>

</body>
</html>
