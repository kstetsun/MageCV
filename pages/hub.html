<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Magic Resume - HUB</title>

  <link rel="stylesheet" href="../styles/main.css">
  <link rel="stylesheet" href="../styles/hub.css">
</head>

<body>

  <div class="hub">

    <!-- Board centred over the chalkboard -->
    <div class="board-wrapper">
      <div class="board">
        <h3>Board</h3>

        <!-- Tracker moved inside the board -->
        <div class="tracker">
          <p>Score: <span id="score">0</span></p>
          <p>Day: <span id="day">1</span></p>
          <p>Resumes Today: <span id="resumesToday">0</span></p>
        </div>

        <p id="boardText">"We're still reviewing your resume..."</p>
      </div>
    </div>

    <!-- Buttons below board -->
    <div class="room">
      <button class="big-btn" onclick="goResume()">Work on resumes</button>
      <button class="small-btn" onclick="nextDay()">New day</button>
      <button class="ghost-btn" onclick="location.href='start.html'">Abandon Run</button>
    </div>

  </div>

  <!-- JavaScript -->
  <script src="../js/data/jobCards.js"></script>

  <script src="../js/data/elf.js"></script>
  <script src="../js/data/dwarf.js"></script>
  <script src="../js/data/wizard.js"></script>
  
  <script src="../js/data/npcs.js"></script>
  <script src="../js/data/messages.js"></script>
  <script src="../js/core/storage.js"></script>
  <script src="../js/core/game.js"></script>
  <script src="../js/core/modifiers.js"></script>
  <script src="../js/screens/hub.js"></script>

</body>
</html>
