<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Magic Resume - HUB</title>

  <link rel="stylesheet" href="../styles/main.css">
</head>

<body>

  <div class="hub">

    <h1>🏠 Mage's Room</h1>

    <div class="stats">
      <p>⭐ Score: <span id="score">0</span></p>
      <p>📅 Day: <span id="day">1</span></p>
      <p>📨 Resumes Today: <span id="resumesToday">0</span></p>
    </div>

    <div class="room">

      <button class="big-btn" onclick="goResume()">
        💻 Work on resumes
      </button>

      <button class="small-btn" onclick="nextDay()">
        ⏭ New day
      </button>

    </div>

    <div class="board">
      <h3>📌 Board</h3>
      <p id="boardText">"We're still reviewing your resume..."</p>
    </div>

  </div>

  <!-- JavaScript -->
  <script src="../js/data/jobCards.js"></script>
  <script src="../js/data/npcs.js"></script>
  <script src="../js/data/messages.js"></script>
  <script src="../js/core/storage.js"></script>
  <script src="../js/core/game.js"></script>
  <script src="../js/core/modifiers.js"></script>
  <script src="../js/screens/hub.js"></script>

</body>
</html>
