<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Magic Resume - HUB</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="hub">

    <h1>🏠 Комната мага</h1>

    <div class="stats">
      <p>⭐ Очки: <span id="score">0</span></p>
      <p>📅 День: <span id="day">1</span></p>
      <p>📨 Сегодня: <span id="resumesToday">0</span> / 10</p>
    </div>

    <div class="room">

      <button class="big-btn" onclick="goToResume()">
        💻 Работать с резюме
      </button>

      <button class="small-btn" onclick="nextDay()">
        ⏭ Новый день
      </button>

    </div>

    <div class="board">
      <h3>📌 Доска</h3>
      <p id="boardText">"Мы всё ещё рассматриваем ваше резюме..."</p>
    </div>

  </div>

  <!-- JS -->
<script src="game.js"></script>
<script src="data.js"></script>
<script src="storage.js"></script>
<script src="hub.js"></script>
<script src="resume.js"></script>
<script src="npc.js"></script>

</body>
</html>
